services:
  - type: web
    name: casecommand
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    disk:
      name: casecommand-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-4-8
      - key: WORKER_MODEL
        value: claude-sonnet-5
      - key: PARALEGAL_INTERVAL
        value: "3600"
      - key: DATABASE_PATH
        value: /data/casecommand.db
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LOG_LEVEL
        value: INFO
